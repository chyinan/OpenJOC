[package]
name = "openjoc-ffmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "External FFmpeg packet/frame bridge for OpenJOC"
build = "build.rs"

[features]
default = []
ffmpeg = ["dep:openjoc-wave"]

[dependencies]
openjoc-api = { version = "0.9.2", path = "../openjoc-api" }
openjoc-eac3 = { version = "0.9.2", path = "../openjoc-eac3" }
openjoc-emdf = { version = "0.9.2", path = "../openjoc-emdf" }
openjoc-scene = { version = "0.9.2", path = "../openjoc-scene" }
openjoc-wave = { version = "0.9.2", path = "../openjoc-wave", optional = true }
sha2 = "0.10"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
openjoc-joc = { version = "0.9.2", path = "../openjoc-joc" }

[[bin]]
name = "openjoc-avdecode"
path = "src/bin/openjoc-avdecode.rs"
required-features = ["ffmpeg"]

[lints]
workspace = true
