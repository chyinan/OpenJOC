[package]
name = "openjoc-scene"
version.workspace = true
description = "Metadata-only scene and reconstruction-basis assembly for OpenJOC"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
openjoc-joc = { version = "0.20.1", path = "../openjoc-joc" }
openjoc-oamd = { version = "0.20.1", path = "../openjoc-oamd" }
serde = { version = "1", features = ["derive"] }
# Preserve finite f64 PCM and metadata bits when scenes are reimported.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
