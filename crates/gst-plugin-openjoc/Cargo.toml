[package]
name = "gst-plugin-openjoc"
version.workspace = true
description = "Native GStreamer audio decoder plugin for OpenJOC E-AC-3 JOC streams"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "gstopenjoc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
gstreamer = [
    "dep:glib",
    "dep:gst",
    "dep:gst_app",
    "dep:gst_audio",
    "dep:gst_base",
    "dep:openjoc-api",
    "dep:openjoc-eac3",
    "dep:openjoc-joc",
]

[dependencies]
glib = { version = "0.21", optional = true }
gst = { package = "gstreamer", version = "0.24.5", features = ["v1_20"], optional = true }
gst_app = { package = "gstreamer-app", version = "0.24.5", features = ["v1_20"], optional = true }
gst_audio = { package = "gstreamer-audio", version = "0.24.5", features = ["v1_20"], optional = true }
gst_base = { package = "gstreamer-base", version = "0.24.5", features = ["v1_20"], optional = true }
openjoc-api = { version = "0.14.0", path = "../openjoc-api", optional = true }
openjoc-eac3 = { version = "0.14.0", path = "../openjoc-eac3", optional = true }
openjoc-joc = { version = "0.14.0", path = "../openjoc-joc", optional = true }

[lints]
workspace = true
