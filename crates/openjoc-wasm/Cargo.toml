[package]
name = "openjoc-wasm"
version.workspace = true
description = "Thin browser-facing WebAssembly bridge for OpenJOC Stereo playback"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["embedded-builtin-hrtf"]
embedded-builtin-hrtf = ["openjoc-api/embedded-builtin-hrtf"]
# Browser builds enable this marker together with --no-default-features to omit
# embedded data. The external-asset ABI is compiled unconditionally.
external-builtin-hrtf-assets = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openjoc-api = { version = "0.18.0", path = "../openjoc-api", default-features = false }
openjoc-eac3 = { version = "0.18.0", path = "../openjoc-eac3" }

[lints]
workspace = true
