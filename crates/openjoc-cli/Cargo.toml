[package]
name = "openjoc-cli"
version.workspace = true
description = "Research-grade E-AC-3 JOC metadata and reconstruction-basis decoder"
readme = "../../README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openjoc"
path = "src/main.rs"

[dependencies]
openjoc-api = { version = "0.12.0", path = "../openjoc-api" }
openjoc-adm = { version = "0.12.0", path = "../openjoc-adm" }
openjoc-eac3 = { version = "0.12.0", path = "../openjoc-eac3" }
openjoc-emdf = { version = "0.12.0", path = "../openjoc-emdf" }
openjoc-ffmpeg = { version = "0.12.0", path = "../openjoc-ffmpeg" }
openjoc-container = { version = "0.12.0", path = "../openjoc-container" }
openjoc-joc = { version = "0.12.0", path = "../openjoc-joc" }
openjoc-oamd = { version = "0.12.0", path = "../openjoc-oamd" }
openjoc-scene = { version = "0.12.0", path = "../openjoc-scene" }
openjoc-wave = { version = "0.12.0", path = "../openjoc-wave" }
openjoc-render-scene = { version = "0.12.0", path = "../openjoc-render-scene" }
openjoc-render = { version = "0.12.0", path = "../openjoc-render" }
openjoc-sofa = { version = "0.12.0", path = "../openjoc-sofa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
terminal_size = "0.4"

[dev-dependencies]
openjoc-wave = { version = "0.12.0", path = "../openjoc-wave" }

[lints]
workspace = true
