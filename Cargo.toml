[workspace]
members = [
    "crates/openjoc-bitio",
    "crates/openjoc-cli",
    "crates/openjoc-eac3",
    "crates/openjoc-emdf",
    "crates/openjoc-joc",
    "crates/openjoc-oamd",
    "crates/openjoc-qmf",
    "crates/openjoc-scene",
    "crates/openjoc-wave",
    "tools/import-etsi-tables",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
