[workspace]
members = [
    "crates/openjoc-bitio",
    "crates/openjoc-cli",
    "crates/openjoc-container",
    "crates/openjoc-eac3",
    "crates/openjoc-emdf",
    "crates/openjoc-joc",
    "crates/openjoc-oamd",
    "crates/openjoc-qmf",
    "crates/openjoc-render",
    "crates/openjoc-render-scene",
    "crates/openjoc-sofa",
    "crates/openjoc-scene",
    "crates/openjoc-wave",
    "tools/import-etsi-tables",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/chyinan/OpenJOC"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Existing normative vectors and clause-shaped test fixtures intentionally use
# exact floating-point literals, explicit bounded casts, and long syntax tests.
# Keep these presentation lints out of the strict gate; correctness warnings
# remain denied by the verification command.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
float_cmp = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
