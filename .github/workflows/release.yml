name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  validate-tag:
    name: validate-tag-source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact pushed tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Validate stable tag and Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if match is None:
              raise SystemExit(
                  f"unsupported release tag {tag!r}; only stable vMAJOR.MINOR.PATCH tags are admitted"
              )
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1", "--locked", "--no-deps"],
                  text=True,
              )
          )
          packages = [
              package
              for package in metadata["packages"]
              if package["name"] == "openjoc-cli"
          ]
          if len(packages) != 1:
              raise SystemExit("expected exactly one openjoc-cli package in Cargo metadata")
          cargo_version = packages[0]["version"]
          expected = ".".join(match.groups())
          if cargo_version != expected:
              raise SystemExit(
                  f"tag/Cargo mismatch: tag={tag!r}, openjoc-cli={cargo_version!r}"
              )
          print(f"validated stable release {tag} against Cargo version {cargo_version}")
          PY

      - name: Verify tag points at the checked-out commit
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          tag_commit=$(git rev-parse "${RELEASE_REF}^{commit}")
          head_commit=$(git rev-parse HEAD)
          test "$tag_commit" = "$head_commit"
          printf 'tag=%s\ncommit=%s\n' "${GITHUB_REF_NAME}" "$head_commit"
          printf 'Cargo.lock sha256='
          shasum -a 256 Cargo.lock

      - name: Validate the matching changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          heading = re.compile(
              rf"^##\s+\[{re.escape(version)}\](?:\s|$)"
          )
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          if not any(heading.match(line) for line in lines):
              raise SystemExit(
                  f"CHANGELOG.md has no section for release tag {tag!r}"
              )
          print(f"validated CHANGELOG.md entry for {tag}")
          PY

      - name: Check the committed tree is clean
        run: |
          git diff --quiet
          git diff --cached --quiet
          git diff --check

  build-release:
    name: build-verify-macos-arm64-release
    needs: validate-tag
    runs-on: macos-14
    steps:
      - name: Check out the exact pushed tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up the required Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select the current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sw_vers
          uname -m
          rustc -vV
          cargo -Vv

      - name: Install GStreamer development package
        run: brew install gstreamer nasm

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Re-run the release quality contract
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build --workspace --release --locked
          cargo package --workspace --locked
          git diff --check

      - name: Build the canonical macOS-arm64 candidate
        run: |
          python3 scripts/build-local-release.py --output "${RUNNER_TEMP}/openjoc-release"

      - name: Verify checksums and bundle inventory
        run: |
          release_dir="${RUNNER_TEMP}/openjoc-release"
          shopt -s nullglob
          checksum_files=("$release_dir"/*.SHA256SUMS)
          test "${#checksum_files[@]}" -eq 1
          checksum_file="${checksum_files[0]}"
          (
            cd "$release_dir"
            shasum -a 256 -c "$(basename "$checksum_file")"
          )
          bundles=("$release_dir"/openjoc-*-aarch64-apple-darwin.tar.gz)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          extracted="${RUNNER_TEMP}/openjoc-release-extracted"
          mkdir -p "$extracted"
          tar -xzf "$bundle" -C "$extracted"
          bundle_root=$(tar -tzf "$bundle" | awk -F/ 'NF > 1 { print $1; exit }')
          test -n "$bundle_root"
          "$extracted/$bundle_root/verify.sh"

      - name: Upload the verified release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-release-${{ github.ref_name }}-aarch64-apple-darwin
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/openjoc-release/openjoc-*-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/openjoc-release/openjoc-*-aarch64-apple-darwin.manifest.json

  build-player-packages:
    name: build-verify-player-packages
    needs: validate-tag
    uses: ./.github/workflows/player-packaging.yml
    with:
      source_ref: ${{ github.ref }}
      release_candidate: true
    permissions:
      contents: read

  build-release-windows:
    name: build-verify-windows-x86_64-release
    needs: validate-tag
    runs-on: windows-2025
    steps:
      - name: Check out the exact pushed tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Select the current stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -Vv

      - name: Re-run the Windows release quality contract
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the canonical Windows archive
        shell: pwsh
        run: |
          python scripts/package-platform-release.py `
            --target x86_64-pc-windows-msvc `
            --output "$env:RUNNER_TEMP/openjoc-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the internal Windows artifact set
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-release-${{ github.ref_name }}-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/openjoc-release/openjoc-*-x86_64-pc-windows-msvc.zip
            ${{ runner.temp }}/openjoc-release/openjoc-*-x86_64-pc-windows-msvc.manifest.json

  build-release-linux:
    name: build-verify-linux-x86_64-release
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact pushed tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Select the current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -Vv

      - name: Install GStreamer development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            nasm \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Re-run the Linux release quality contract
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build --workspace --release --locked
          git diff --check

      - name: Package the canonical Linux archive
        run: |
          python3 scripts/package-platform-release.py \
            --target x86_64-unknown-linux-gnu \
            --output "${RUNNER_TEMP}/openjoc-release"

      - name: Upload the internal Linux artifact set
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-release-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/openjoc-release/openjoc-*-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/openjoc-release/openjoc-*-x86_64-unknown-linux-gnu.manifest.json

  publish-release:
    name: publish-github-release
    needs:
      - build-release
      - build-release-windows
      - build-release-linux
      - build-player-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the exact pushed tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Download the verified artifact set
        uses: actions/download-artifact@v4
        with:
          pattern: openjoc-release-${{ github.ref_name }}-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: false

      - name: Download the verified player artifact set
        uses: actions/download-artifact@v4
        with:
          pattern: openjoc-player-release-*
          path: ${{ runner.temp }}/player-assets
          merge-multiple: false

      - name: Download the verified ecosystem artifact set
        uses: actions/download-artifact@v4
        with:
          pattern: openjoc-ecosystem-release-*
          path: ${{ runner.temp }}/ecosystem-assets
          merge-multiple: true

      - name: Aggregate and verify the public release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python3 scripts/aggregate-release-assets.py \
            --input "${RUNNER_TEMP}/release-assets" \
            --output "${RUNNER_TEMP}/public-release" \
            --player-input "${RUNNER_TEMP}/player-assets" \
            --ecosystem-input "${RUNNER_TEMP}/ecosystem-assets" \
            --version "$version"

      - name: Verify the remote tag and required assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null
          version="${RELEASE_TAG#v}"
          asset_dir="${RUNNER_TEMP}/public-release"
          assets=(
            "$asset_dir/openjoc-${version}-aarch64-apple-darwin.tar.gz"
            "$asset_dir/openjoc-${version}-x86_64-pc-windows-msvc.zip"
            "$asset_dir/openjoc-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "$asset_dir/openjoc-mpv-${version}-macos-arm64.tar.gz"
            "$asset_dir/openjoc-mpv-${version}-linux-x86_64.tar.gz"
            "$asset_dir/openjoc-mpv-${version}-windows-x64.zip"
            "$asset_dir/openjoc-sdk-${version}-macos-arm64.tar.gz"
            "$asset_dir/openjoc-sdk-${version}-linux-x86_64.tar.gz"
            "$asset_dir/openjoc-sdk-${version}-windows-x64.zip"
            "$asset_dir/openjoc-ffmpeg-${version}-macos-arm64.tar.gz"
            "$asset_dir/openjoc-ffmpeg-${version}-linux-x86_64.tar.gz"
            "$asset_dir/openjoc-ffmpeg-${version}-windows-x64.zip"
            "$asset_dir/openjoc-gstreamer-plugin-${version}-macos-arm64.tar.gz"
            "$asset_dir/openjoc-gstreamer-plugin-${version}-linux-x86_64.tar.gz"
            "$asset_dir/openjoc-gstreamer-plugin-${version}-windows-x64.zip"
            "$asset_dir/SHA256SUMS"
          )
          test "${#assets[@]}" -eq 16
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          test "$(find "$asset_dir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 16
          printf '%s\n' "${assets[@]}"

      - name: Refuse to overwrite an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi

      - name: Create a draft release, upload all assets, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/openjoc-release-notes.md"
          python3 - "$RELEASE_TAG" CHANGELOG.md "$notes" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag, changelog_path, notes_path = sys.argv[1:]
          version = tag.removeprefix("v")
          heading = re.compile(
              rf"^##\s+\[{re.escape(version)}\](?:\s|$)"
          )
          next_heading = re.compile(r"^##\s+\[")
          lines = Path(changelog_path).read_text(encoding="utf-8").splitlines()
          start = next(
              (index for index, line in enumerate(lines) if heading.match(line)),
              None,
          )
          if start is None:
              raise SystemExit(
                  f"CHANGELOG.md has no section for release tag {tag!r}"
              )
          end = next(
              (
                  index
                  for index in range(start + 1, len(lines))
                  if next_heading.match(lines[index])
              ),
              len(lines),
          )
          section = lines[start:end]
          if len(section) < 2:
              raise SystemExit(f"CHANGELOG.md section for {tag!r} is empty")
          Path(notes_path).write_text(
              "\n".join(section).rstrip()
              + "\n\n## Verification\n\n"
              + "- GitHub Actions verified the exact version tag, source tree, and release artifact checksums.\n"
              + "- The published CLI/library and OpenJOC Player Bundle targets are macOS arm64, Linux x86_64, and Windows x64 surfaces.\n"
              + "- Per-platform manifests remain internal verification artifacts; the public asset set contains one unified SHA256SUMS file.\n",
              encoding="utf-8",
          )
          PY
          version="${RELEASE_TAG#v}"
          asset_dir="${RUNNER_TEMP}/public-release"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "OpenJOC ${version} — Interchange & Ecosystem" \
            --notes-file "$notes"
          gh release upload "$RELEASE_TAG" \
            "$asset_dir/openjoc-${version}-aarch64-apple-darwin.tar.gz" \
            "$asset_dir/openjoc-${version}-x86_64-pc-windows-msvc.zip" \
            "$asset_dir/openjoc-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "$asset_dir/openjoc-mpv-${version}-macos-arm64.tar.gz" \
            "$asset_dir/openjoc-mpv-${version}-linux-x86_64.tar.gz" \
            "$asset_dir/openjoc-mpv-${version}-windows-x64.zip" \
            "$asset_dir/openjoc-sdk-${version}-macos-arm64.tar.gz" \
            "$asset_dir/openjoc-sdk-${version}-linux-x86_64.tar.gz" \
            "$asset_dir/openjoc-sdk-${version}-windows-x64.zip" \
            "$asset_dir/openjoc-ffmpeg-${version}-macos-arm64.tar.gz" \
            "$asset_dir/openjoc-ffmpeg-${version}-linux-x86_64.tar.gz" \
            "$asset_dir/openjoc-ffmpeg-${version}-windows-x64.zip" \
            "$asset_dir/openjoc-gstreamer-plugin-${version}-macos-arm64.tar.gz" \
            "$asset_dir/openjoc-gstreamer-plugin-${version}-linux-x86_64.tar.gz" \
            "$asset_dir/openjoc-gstreamer-plugin-${version}-windows-x64.zip" \
            "$asset_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
