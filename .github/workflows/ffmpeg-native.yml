name: Native FFmpeg integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ffmpeg-native.yml"
      - "Cargo.lock"
      - "crates/openjoc-capi/**"
      - "crates/openjoc-ffmpeg/**"
      - "integrations/ffmpeg/native/**"

permissions:
  contents: read

concurrency:
  group: ffmpeg-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  stable:
    name: FFmpeg 9.0.1 patch/build/decode
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OpenJOC
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git nasm pkg-config
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify exported patch integrity
        run: |
          echo "065e837cf540ee5f53fb5c139de316e5023d3490e6cff345d4aec9e81cab88c9  integrations/ffmpeg/native/patches/0001-avcodec-add-experimental-libopenjoc-decoder-wrapper.patch" \
            | sha256sum --check

      - name: Generate a redistributable synthetic JOC fixture
        env:
          OPENJOC_SYNTHETIC_JOC_PATH: ${{ runner.temp }}/synthetic-joc.ec3
        run: |
          cargo test -p openjoc-ffmpeg --locked \
            export_synthetic_joc_fixture_when_requested
          test -s "$OPENJOC_SYNTHETIC_JOC_PATH"

      - name: Check out the pinned FFmpeg source
        run: |
          git clone --branch n9.0.1 --depth 1 \
            https://github.com/FFmpeg/FFmpeg.git \
            "$RUNNER_TEMP/ffmpeg"
          test "$(git -C "$RUNNER_TEMP/ffmpeg" rev-parse HEAD)" = \
            bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa

      - name: Apply, build, register, and decode through libopenjoc
        run: |
          integrations/ffmpeg/native/verify-build.sh \
            "$RUNNER_TEMP/ffmpeg" \
            "$RUNNER_TEMP/ffmpeg-build" \
            "$RUNNER_TEMP/openjoc-prefix" \
            "$RUNNER_TEMP/synthetic-joc.ec3"

      - name: Check integration-source formatting
        run: |
          cargo fmt --all -- --check
          git diff --check
