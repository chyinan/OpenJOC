name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Select the current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -Vv

      - name: Install media-framework development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            nasm \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Build the native GStreamer plugin
        run: cargo build -p gst-plugin-openjoc --release --features gstreamer --locked

      - name: Cargo package verification
        run: cargo package --workspace --locked

      - name: Diff check
        run: git diff --check

  platform-windows:
    name: platform-windows
    runs-on: windows-2025
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Select the current stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -Vv

      - name: Platform-neutral workspace tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Platform-neutral release build
        shell: pwsh
        run: cargo build --workspace --release --locked

  platform-macos:
    name: platform-macos-arm64
    runs-on: macos-14
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Select the current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sw_vers
          uname -m
          rustc -vV
          cargo -Vv

      - name: Install media-framework development packages
        run: |
          brew install gstreamer nasm

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Platform-neutral workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Platform-neutral release build
        run: cargo build --workspace --release --locked

      - name: Build the native GStreamer plugin
        run: cargo build -p gst-plugin-openjoc --release --features gstreamer --locked

  msrv:
    name: msrv-1.85
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Check the documented minimum Rust version
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            nasm \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev
          rustup toolchain install 1.85.0 --profile minimal
          rustc +1.85.0 -vV
          cargo +1.85.0 -Vv

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Check all features at the documented Rust minimum
        run: cargo +1.85.0 check --workspace --all-features --locked
