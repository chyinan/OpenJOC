name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Select the current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -Vv

      - name: Install media-framework development packages
        run: |
          apt_sourceparts="$RUNNER_TEMP/openjoc-apt-sourceparts"
          mkdir -p "$apt_sourceparts"
          shopt -s nullglob
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && ! grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              cp "$source" "$apt_sourceparts/"
            fi
          done
          apt_options=(
            -o Dir::Etc::sourcelist=/dev/null
            -o Dir::Etc::sourceparts="$apt_sourceparts"
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-good \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            nasm \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Repository documentation and hygiene
        run: |
          python3 -m unittest scripts.tests.test_repository_hygiene
          python3 scripts/check_repository_hygiene.py

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: Build the native GStreamer plugin
        run: cargo build -p gst-plugin-openjoc --release --features gstreamer --locked

      - name: Generate the public synthetic JOC fixture and run self-test
        run: |
          scripts/generate-player-fixtures.sh "$RUNNER_TEMP/openjoc-player-fixtures"
          OPENJOC_PUBLIC_JOC_FIXTURE="$RUNNER_TEMP/openjoc-player-fixtures/joc.ec3" \
            cargo run -p openjoc-cli --release --locked -- self-test --fixture "$RUNNER_TEMP/openjoc-player-fixtures/joc.ec3"

      - name: Cargo package verification
        run: cargo package --workspace --locked

      - name: Diff check
        run: git diff --check

  platform-windows:
    name: platform-windows
    runs-on: windows-2025
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Select the current stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -Vv

      - name: Platform-neutral workspace tests
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Platform-neutral release build
        shell: pwsh
        run: cargo build --workspace --release --locked

  platform-macos:
    name: platform-macos-arm64
    runs-on: macos-14
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Select the current stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sw_vers
          uname -m
          rustc -vV
          cargo -Vv

      - name: Install media-framework development packages
        run: |
          brew install gstreamer nasm
          brew_prefix=
          brew_prefix=$(brew --prefix)
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$brew_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Isolate host media tools from the FFmpeg SDK
        run: |
          media_tools="$RUNNER_TEMP/openjoc-host-media-tools"
          mkdir -p "$media_tools"
          for tool in ffmpeg ffprobe mp4box; do
            tool_path=$(command -v "$tool" || true)
            if [ -z "$tool_path" ]; then
              continue
            fi
            cat > "$media_tools/$tool" <<EOF
          #!/bin/sh
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          exec "$tool_path" "\$@"
          EOF
            chmod +x "$media_tools/$tool"
          done
          export PATH="$media_tools:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          for tool in ffmpeg ffprobe mp4box; do
            if command -v "$tool" >/dev/null 2>&1; then
              test "$(command -v "$tool")" = "$media_tools/$tool"
              "$tool" -version
            fi
          done

      - name: Platform-neutral workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Platform-neutral release build
        run: cargo build --workspace --release --locked

      - name: Build the native GStreamer plugin
        run: cargo build -p gst-plugin-openjoc --release --features gstreamer --locked

  msrv:
    name: msrv-1.85
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the committed source
        uses: actions/checkout@v4

      - name: Check the documented minimum Rust version
        run: |
          apt_sourceparts="$RUNNER_TEMP/openjoc-apt-sourceparts"
          mkdir -p "$apt_sourceparts"
          shopt -s nullglob
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && ! grep -q 'dl.google.com/linux/chrome-stable' "$source"; then
              cp "$source" "$apt_sourceparts/"
            fi
          done
          apt_options=(
            -o Dir::Etc::sourcelist=/dev/null
            -o Dir::Etc::sourceparts="$apt_sourceparts"
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            nasm \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev
          rustup toolchain install 1.85.0 --profile minimal
          rustc +1.85.0 -vV
          cargo +1.85.0 -Vv

      - name: Build the minimum FFmpeg 9 SDK
        run: |
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz \
            --output "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-9.0.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.0.1"
          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg9" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-static \
            --enable-shared \
            --disable-everything \
            --enable-protocol=file \
            --enable-demuxer=eac3,mov,matroska \
            --enable-parser=ac3
          make -j2
          make install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/ffmpeg9/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg9/lib" >> "$GITHUB_ENV"

      - name: Check all features at the documented Rust minimum
        run: cargo +1.85.0 check --workspace --all-features --locked
