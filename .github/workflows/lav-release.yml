name: LAV OpenJOC release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: OpenJOC release tag to receive the LAV asset
        required: true
        default: v0.19.0
      variant:
        description: Package variant (audio keeps the one-click onboarding default)
        type: choice
        required: true
        default: audio
        options:
          - audio
          - full
      lav_ref:
        description: Full LAVFilters-OpenJOC commit to build
        required: true
        default: a876fbc0ca2615fdaa240cf96ac13c82f28689a9

permissions:
  contents: write

concurrency:
  group: lav-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-lav:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      LAV_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.lav_ref || 'a876fbc0ca2615fdaa240cf96ac13c82f28689a9' }}
      LAV_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'audio' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Keep build tooling at the workflow revision, while compiling CAPI from
      # the exact OpenJOC release tag that will receive the asset.
      - name: Check out build tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check out OpenJOC release sources
        uses: actions/checkout@v4
        with:
          path: openjoc-release
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Check out pinned LAV sources
        uses: actions/checkout@v4
        with:
          repository: chyinan/LAVFilters-OpenJOC
          path: lav
          ref: ${{ env.LAV_REF }}
          fetch-depth: 0
          submodules: recursive

      - name: Check out pinned zlib sources
        uses: actions/checkout@v4
        with:
          repository: madler/zlib
          path: zlib
          ref: v1.3.1
          fetch-depth: 1

      - name: Resolve release identity
        id: identity
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release tag must look like vMAJOR.MINOR.PATCH: $tag"
          }
          if ($env:LAV_VARIANT -notin @('audio', 'full')) {
            throw "unsupported LAV package variant: $env:LAV_VARIANT"
          }
          $assetPrefix = if ($env:LAV_VARIANT -eq 'full') { 'openjoc-lav-full' } else { 'openjoc-lav' }
          "release_version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "asset_name=$assetPrefix-$($tag.Substring(1))-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Verify full-build v145 ATL and Windows SDK
        if: env.LAV_VARIANT == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'No Visual Studio C++ installation.' }
          $version = (Get-Content -Raw -LiteralPath (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          if ($version -notmatch '^14\.5\d+\.') { throw "Expected the verified v145/default compiler family, found $version" }
          $vc = Join-Path $vs "VC\Tools\MSVC\$version"
          $atl = Join-Path $vc 'atlmfc\include\atlbase.h'
          $atlLib = Join-Path $vc 'atlmfc\lib\x64\atls.lib'
          $toolsetProps = Get-ChildItem -LiteralPath (Join-Path $vs 'MSBuild\Microsoft\VC') -Recurse -Filter Toolset.props | Where-Object { $_.FullName -match '\\Platforms\\x64\\PlatformToolsets\\v145\\Toolset\.props$' } | Select-Object -First 1
          if ($null -eq $toolsetProps) { throw 'v145 x64 MSBuild Toolset.props is missing.' }
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $sdk = Get-ChildItem -LiteralPath (Join-Path $kits 'Include') -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($null -eq $sdk) { throw 'Windows SDK10 include directory is missing.' }
          $windowsHeader = Join-Path $sdk.FullName 'um\Windows.h'
          $kernelLib = Join-Path $kits "Lib\$($sdk.Name)\um\x64\kernel32.lib"
          foreach ($path in @($atl, $atlLib, $windowsHeader, $kernelLib, (Join-Path $vc 'bin\Hostx64\x64\cl.exe'))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Selected toolchain input missing: $path" }
            Write-Host "Verified toolchain input: $path"
          }
          $source = Join-Path $env:RUNNER_TEMP 'lav-toolchain-check.cpp'
          $object = Join-Path $env:RUNNER_TEMP 'lav-toolchain-check.obj'
          [IO.File]::WriteAllText($source, "#include <windows.h>`n#include <atlbase.h>`nint main() { return 0; }`n")
          $selectedSdkFile = Join-Path $env:RUNNER_TEMP 'lav-selected-sdk.txt'
          $command = Join-Path $env:RUNNER_TEMP 'lav-toolchain-check.cmd'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -no_logo
          if errorlevel 1 exit /b %errorlevel%
          echo Compiler directory: %VCToolsInstallDir%
          echo Windows SDK version: %WindowsSDKVersion%
          echo %WindowsSDKVersion%>"$selectedSdkFile"
          cl /nologo /c /EHsc /std:c++17 "$source" /Fo"$object"
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $command -Encoding ascii
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $object -PathType Leaf)) { throw 'v145 ATL/Windows SDK compile-only check failed.' }
          $selectedSdk = (Get-Content -Raw -LiteralPath $selectedSdkFile).Trim().TrimEnd('\')
          $selectedHeader = Join-Path $kits "Include\$selectedSdk\um\Windows.h"
          if (-not (Test-Path -LiteralPath $selectedHeader -PathType Leaf)) { throw "Selected compiler SDK header missing: $selectedHeader" }
          $selectedKernelLib = Join-Path $kits "Lib\$selectedSdk\um\x64\kernel32.lib"
          if (-not (Test-Path -LiteralPath $selectedKernelLib -PathType Leaf)) { throw "Selected compiler SDK library missing: $selectedKernelLib" }
          Write-Host "Verified v145 ATL compile with Windows SDK $selectedSdk"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build OpenJOC C API
        shell: pwsh
        working-directory: openjoc-release
        run: cargo build -p openjoc-capi --release --locked --jobs 1

      - name: Set up MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            make
            nasm
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-libwinpthread
            mingw-w64-x86_64-zlib

      - name: Build zlib MSVC dependency
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ installation was not found.' }
          $definition = Join-Path $env:GITHUB_WORKSPACE 'zlib\contrib\vstudio\vc17\zlibvc.def'
          $definitionText = Get-Content -Raw -LiteralPath $definition
          if ($definitionText -notmatch '(?m)^[ \t]*VERSION[ \t]+\d+\.\d+(?:\.\d+)?[ \t]*\r?$') { throw 'unexpected zlib module definition VERSION line.' }
          $definitionText = $definitionText -replace '(?m)^[ \t]*VERSION[ \t]+[^\r\n]*(?:\r?\n|$)', ''
          [IO.File]::WriteAllText($definition, $definitionText, [Text.UTF8Encoding]::new($false))
          $solution = Join-Path $env:GITHUB_WORKSPACE 'zlib\contrib\vstudio\vc17\zlibvc.sln'
          $commandFile = Join-Path $env:RUNNER_TEMP 'openjoc-build-zlib.cmd'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -no_logo
          if errorlevel 1 exit /b %errorlevel%
          msbuild "$solution" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $commandFile -Encoding ascii
          & cmd.exe /d /c $commandFile
          if ($LASTEXITCODE -ne 0) { throw "zlib MSVC build failed: $LASTEXITCODE" }
          $zlibOutput = Join-Path $env:GITHUB_WORKSPACE 'zlib\contrib\vstudio\vc17\x64\ZlibDllRelease'
          foreach ($name in @('zlibwapi.dll', 'zlibwapi.lib')) {
            if (-not (Test-Path -LiteralPath (Join-Path $zlibOutput $name) -PathType Leaf)) {
              throw "zlib output is missing: $name"
            }
          }

      - name: Prepare LAV FFmpeg inputs
        shell: pwsh
        run: |
          $lav = Join-Path $env:GITHUB_WORKSPACE 'lav'
          $include = Join-Path $lav 'thirdparty\64\include'
          $library = Join-Path $lav 'thirdparty\64\lib'
          New-Item -ItemType Directory -Path $include, $library -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'zlib\zlib.h') -Destination $include -Force
          $zconf = Join-Path $include 'zconf.h'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'zlib\zconf.h') -Destination $zconf -Force
          $zconfText = Get-Content -Raw -LiteralPath $zconf
          $zconfText = $zconfText.Replace('#  if defined(Z_HAVE_UNISTD_H)', '#  if defined(Z_HAVE_UNISTD_H) && !defined(_WIN32)')
          if (-not $zconfText.Contains('#  if defined(Z_HAVE_UNISTD_H) && !defined(_WIN32)')) { throw 'zlib Windows include guard was not applied.' }
          [IO.File]::WriteAllText($zconf, $zconfText, [Text.UTF8Encoding]::new($false))
          $zlibLibrary = Join-Path $library 'zlib.lib'
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'zlib\contrib\vstudio\vc17\x64\ZlibDllRelease\zlibwapi.lib') -Destination $zlibLibrary -Force
          Copy-Item -LiteralPath $zlibLibrary -Destination (Join-Path $lav 'ffmpeg\zlib.lib') -Force
          $avisynthSource = Join-Path $include 'avisynth'
          $avisynthDestination = Join-Path $lav 'ffmpeg\avisynth'
          if (-not (Test-Path -LiteralPath $avisynthSource -PathType Container)) { throw 'LAV Avisynth headers are missing.' }
          Copy-Item -LiteralPath $avisynthSource -Destination $avisynthDestination -Recurse -Force
          $buildScript = Join-Path $lav 'build_ffmpeg_msvc.sh'
          $buildScriptText = Get-Content -Raw -LiteralPath $buildScript
          $buildScriptText = $buildScriptText.Replace("`r`n", "`n")
          $zlibOption = "    --enable-zlib                   \`n"
          if (-not $buildScriptText.Contains($zlibOption)) { throw 'LAV FFmpeg zlib option was not found.' }
          $zlibOptionWithLibrary = "    --enable-zlib                   \`n    --extra-libs=../thirdparty/64/lib/zlib.lib                 \`n"
          $buildScriptText = $buildScriptText.Replace($zlibOption, $zlibOptionWithLibrary)
          if (-not $buildScriptText.Contains('--extra-libs=../thirdparty/64/lib/zlib.lib')) { throw 'LAV FFmpeg zlib library option was not applied.' }
          $configure = Join-Path $lav 'ffmpeg\configure'
          python scripts/prepare_lav_ffmpeg_configure.py "$configure"
          if ($LASTEXITCODE -ne 0) { throw "LAV FFmpeg dependency preparation failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $zlibLibrary -PathType Leaf)) { throw 'LAV FFmpeg zlib library is missing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $lav 'ffmpeg\zlib.lib') -PathType Leaf)) { throw 'FFmpeg working-directory zlib library is missing.' }
          Write-Host "Prepared FFmpeg zlib library: $zlibLibrary"
          $buildScriptText | Select-String -Pattern 'extra-libs=.*zlib\.lib' | ForEach-Object { Write-Host $_.Line }
          [IO.File]::WriteAllText($buildScript, $buildScriptText, [Text.UTF8Encoding]::new($false))

      - name: Build LAV FFmpeg
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $commandFile = Join-Path $env:RUNNER_TEMP 'openjoc-build-lav-ffmpeg.cmd'
          $lav = Join-Path $env:GITHUB_WORKSPACE 'lav'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -no_logo
          if errorlevel 1 exit /b %errorlevel%
          set VSLANG=1033
          cd /d "$lav"
          bash -c "sh ./build_ffmpeg_msvc.sh x64 release"
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $commandFile -Encoding ascii
          & cmd.exe /d /c $commandFile
          if ($LASTEXITCODE -ne 0) { throw "LAV FFmpeg build failed: $LASTEXITCODE" }
          foreach ($name in @('avcodec-lav-63.dll', 'avfilter-lav-12.dll', 'avformat-lav-63.dll', 'avutil-lav-61.dll', 'swresample-lav-7.dll', 'swscale-lav-10.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $lav "bin_x64\$name") -PathType Leaf)) { throw "FFmpeg output is missing: $name" }
          }

      - name: Retain FFmpeg configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lav-ffmpeg-diagnostics-${{ github.run_id }}
          path: |
            lav/ffmpeg/ffbuild/config.log
            lav/ffmpeg/ffbuild/config.out
          if-no-files-found: ignore

      - name: Build libbluray runtime dependency
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ installation was not found.' }
          $lav = Join-Path $env:GITHUB_WORKSPACE 'lav'
          $project = Join-Path $lav 'libbluray\libbluray.vcxproj'
          $commandFile = Join-Path $env:RUNNER_TEMP 'openjoc-build-libbluray.cmd'
          @"
          @echo off
          call "$vs\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -no_logo
          if errorlevel 1 exit /b %errorlevel%
          msbuild "$project" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $commandFile -Encoding ascii
          & cmd.exe /d /c $commandFile
          if ($LASTEXITCODE -ne 0) { throw "libbluray MSVC build failed: $LASTEXITCODE" }
          $built = Join-Path $lav 'libbluray\bin_x64\libbluray\libbluray.dll'
          if (-not (Test-Path -LiteralPath $built -PathType Leaf)) { throw "libbluray output is missing: $built" }
          Copy-Item -LiteralPath $built -Destination (Join-Path $lav 'bin_x64\libbluray.dll') -Force
          $msysCommand = Join-Path $env:RUNNER_TEMP 'setup-msys2\msys2.cmd'
          if (-not (Test-Path -LiteralPath $msysCommand -PathType Leaf)) { throw "MSYS2 command wrapper is missing: $msysCommand" }
          $mingwBin = (& $msysCommand -c "'cygpath' '-w' '/mingw64/bin'").Trim()
          if ([string]::IsNullOrWhiteSpace($mingwBin) -or -not (Test-Path -LiteralPath $mingwBin -PathType Container)) {
            throw "MSYS2 MinGW bin directory is missing: $mingwBin"
          }
          foreach ($name in @('libgcc_s_seh-1.dll', 'libwinpthread-1.dll', 'zlib1.dll')) {
            $source = Join-Path $mingwBin $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "MSYS2 runtime is missing: $source" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $lav "bin_x64\$name") -Force
          }

      - name: Build selected LAV filters
        shell: pwsh
        run: |
          $commandFile = Join-Path $env:RUNNER_TEMP 'openjoc-build-lav-filters.cmd'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $vsdevcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $lav = Join-Path $env:GITHUB_WORKSPACE 'lav'
          $include = Join-Path $env:GITHUB_WORKSPACE 'openjoc-release\crates\openjoc-capi\include'
          $log = Join-Path $env:RUNNER_TEMP 'lav-msbuild.log'
          @"
          @echo off
          call "$env:GITHUB_WORKSPACE\scripts\release_lav_msbuild.cmd" "$vsdevcmd" "$lav" "$include" "$log" "$env:LAV_VARIANT"
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $commandFile -Encoding ascii
          & cmd.exe /d /c $commandFile
          if ($LASTEXITCODE -ne 0) { throw "LAV $env:LAV_VARIANT build failed: $LASTEXITCODE" }
          $outputs = @('LAVAudio.ax')
          if ($env:LAV_VARIANT -eq 'full') {
            $outputs += @('LAVVideo.ax', 'LAVSplitter.ax', 'IntelQuickSyncDecoder.dll')
          }
          foreach ($name in $outputs) {
            if (-not (Test-Path -LiteralPath (Join-Path $lav "bin_x64\$name") -PathType Leaf)) { throw "LAV output is missing: $name" }
          }
          if ($env:LAV_VARIANT -eq 'full') {
            # The complete solution rebuild refreshes libbluray; use that final output.
            Copy-Item -LiteralPath (Join-Path $lav 'libbluray\bin_x64\libbluray\libbluray.dll') -Destination (Join-Path $lav 'bin_x64\libbluray.dll') -Force
          }

      - name: Build LAV smoke tests
        shell: pwsh
        run: |
          $commandFile = Join-Path $env:RUNNER_TEMP 'openjoc-build-lav-smokes.cmd'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $vsdevcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $lav = Join-Path $env:GITHUB_WORKSPACE 'lav'
          $include = Join-Path $env:GITHUB_WORKSPACE 'openjoc-release\crates\openjoc-capi\include'
          $smokes = Join-Path $env:RUNNER_TEMP 'openjoc-lav-smokes'
          New-Item -ItemType Directory -Path $smokes -Force | Out-Null
          @"
          @echo off
          call "$env:GITHUB_WORKSPACE\scripts\release_lav_smokes.cmd" "$vsdevcmd" "$lav" "$include" "$env:GITHUB_WORKSPACE\scripts\tests\LavSmokeNoopLifecycle.cpp" "$smokes"
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $commandFile -Encoding ascii
          & cmd.exe /d /c $commandFile
          if ($LASTEXITCODE -ne 0) { throw "LAV smoke build failed: $LASTEXITCODE" }

      - name: Collect MSVC runtime dependencies
        shell: pwsh
        run: |
          $dependencyDir = Join-Path $env:RUNNER_TEMP 'openjoc-lav-runtime-dependencies'
          New-Item -ItemType Directory -Path $dependencyDir -Force | Out-Null
          $zlibDll = Join-Path $env:GITHUB_WORKSPACE 'zlib\contrib\vstudio\vc17\x64\ZlibDllRelease\zlibwapi.dll'
          Copy-Item -LiteralPath $zlibDll -Destination $dependencyDir -Force
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $requiredCrt = @('vcruntime140.dll', 'vcruntime140_1.dll', 'vcruntime140_threads.dll')
          if ($env:LAV_VARIANT -eq 'full') {
            $requiredCrt += @(
              'concrt140.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
              'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll', 'vccorlib140.dll'
            )
          }
          $crt = Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Redist\MSVC') -Recurse -Filter 'vcruntime140.dll' |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT\\vcruntime140\.dll$' } |
            ForEach-Object {
              $candidateDir = $_.Directory
              $complete = $true
              foreach ($name in $requiredCrt) {
                if (-not (Test-Path -LiteralPath (Join-Path $candidateDir.FullName $name) -PathType Leaf)) { $complete = $false; break }
              }
              if ($complete) { $_ }
            } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $crt) { throw 'MSVC x64 runtime was not found.' }
          $crtDir = $crt.Directory.FullName
          $sdkRedist = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Redist'
          $api = Get-ChildItem -LiteralPath $sdkRedist -Recurse -Filter 'api-ms-win-crt-runtime-l1-1-0.dll' | Where-Object { $_.FullName -match '\\ucrt\\DLLs\\x64\\' } | Select-Object -First 1
          if ($null -eq $api) { throw 'Windows SDK x64 UCRT redistributable was not found.' }
          $apiDir = $api.Directory.FullName
          $names = @(
            'api-ms-win-crt-conio-l1-1-0.dll', 'api-ms-win-crt-convert-l1-1-0.dll',
            'api-ms-win-crt-environment-l1-1-0.dll', 'api-ms-win-crt-filesystem-l1-1-0.dll',
            'api-ms-win-crt-heap-l1-1-0.dll', 'api-ms-win-crt-locale-l1-1-0.dll',
            'api-ms-win-crt-math-l1-1-0.dll', 'api-ms-win-crt-multibyte-l1-1-0.dll',
            'api-ms-win-crt-private-l1-1-0.dll', 'api-ms-win-crt-process-l1-1-0.dll',
            'api-ms-win-crt-runtime-l1-1-0.dll', 'api-ms-win-crt-stdio-l1-1-0.dll',
            'api-ms-win-crt-string-l1-1-0.dll', 'api-ms-win-crt-time-l1-1-0.dll',
            'api-ms-win-crt-utility-l1-1-0.dll', 'ucrtbase.dll', 'vcruntime140.dll',
            'vcruntime140_1.dll', 'vcruntime140_threads.dll'
          )
          foreach ($name in $names) {
            $source = if ($name.StartsWith('api-ms-win-crt-') -or $name -eq 'ucrtbase.dll') { Join-Path $apiDir $name } else { Join-Path $crtDir $name }
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "MSVC dependency is missing: $source" }
            Copy-Item -LiteralPath $source -Destination $dependencyDir -Force
          }
          if ($env:LAV_VARIANT -eq 'full') {
            # Include the matching C++/concurrency CRT set used by Video and QuickSync.
            Get-ChildItem -LiteralPath $crtDir -Filter '*.dll' | Copy-Item -Destination $dependencyDir -Force
          }
          "dependency_dir=$dependencyDir" >> $env:GITHUB_OUTPUT
        id: dependencies

      - name: Package LAV release asset
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'openjoc-lav-release'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $template = if ($env:LAV_VARIANT -eq 'full') { 'packaging\windows-lav-full' } else { 'packaging\windows-lav' }
          $variantOptions = @()
          if ($env:LAV_VARIANT -eq 'full') {
            # License notices must match the C API sources, not the tooling checkout.
            $variantOptions = @('--core-source-root', (Join-Path $env:GITHUB_WORKSPACE 'openjoc-release'))
          }
          python scripts/package_lav_release.py `
            --variant $env:LAV_VARIANT `
            --release-version $env:RELEASE_VERSION `
            --lav-root (Join-Path $env:GITHUB_WORKSPACE 'lav') `
            --capi-dll (Join-Path $env:GITHUB_WORKSPACE 'openjoc-release\target\release\openjoc_capi.dll') `
            --dependency-dir '${{ steps.dependencies.outputs.dependency_dir }}' `
            --onboarding-template (Join-Path $env:GITHUB_WORKSPACE $template) `
            --output-dir $output @variantOptions
          if ($LASTEXITCODE -ne 0) { throw "LAV package creation failed: $LASTEXITCODE" }
          "package_dir=$output" >> $env:GITHUB_OUTPUT
        id: package

      - name: Validate package and standalone smoke tests
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
        run: |
          $archive = Join-Path '${{ steps.package.outputs.package_dir }}' '${{ steps.identity.outputs.asset_name }}.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'openjoc-lav-package-validation'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $lavAudio = Join-Path $extract 'runtime\LAVAudio.ax'
          $lavAudioBytes = [IO.File]::ReadAllBytes($lavAudio)
          $lavAudioAscii = [Text.Encoding]::ASCII.GetString($lavAudioBytes)
          $lavAudioUnicode = [Text.Encoding]::Unicode.GetString($lavAudioBytes)
          if (-not ($lavAudioAscii.Contains('JOC Stream') -or $lavAudioUnicode.Contains('JOC Stream'))) {
            throw 'LAVAudio.ax does not contain the JOC Stream property-page resource.'
          }
          # The full archive has manual registration tools only. Reuse the checked-in
          # read-only package preflight without adding audio onboarding to that ZIP.
          $validationRoot = if ($env:LAV_VARIANT -eq 'full') { Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-lav' } else { $extract }
          Import-Module (Join-Path $validationRoot 'scripts\OpenJoc.Onboarding.Shell.psm1') -Force
          $session = New-OpenJocSession -Operation 'validate' -PackageRoot $extract -InstallRoot (Join-Path $env:RUNNER_TEMP 'openjoc-lav-install-validation') -LogPath (Join-Path $env:RUNNER_TEMP 'openjoc-lav-validation.log')
          $preflight = Test-OpenJocPackage $session
          if (-not $preflight.Success) { throw $preflight.Detail }
          $smokes = Join-Path $env:RUNNER_TEMP 'openjoc-lav-smokes'
          # Native tests resolve imports beside the EXE, using this exact package.
          Copy-Item -Path (Join-Path $extract 'runtime\*') -Destination $smokes -Recurse -Force
          foreach ($name in @('AudioStatusCapacityTests.exe', 'OpenJocAdmissionTests.exe', 'OpenJocDiagnosticTests.exe', 'OpenJocDialnormPolicyTests.exe', 'OpenJocOutputTests.exe', 'OpenJocStrictOutputTests.exe', 'OpenJocShippedLayoutsTests.exe')) {
            & (Join-Path $smokes $name)
            if ($LASTEXITCODE -ne 0) { throw "standalone smoke failed: $name ($LASTEXITCODE)" }
          }
          & (Join-Path $smokes 'OpenJocSettingsSmoke.exe') $lavAudio
          if ($LASTEXITCODE -ne 0) { throw "settings smoke failed: $LASTEXITCODE" }
          & (Join-Path $smokes 'OpenJocSettingsSmoke.exe') $lavAudio --output-gain-only
          if ($LASTEXITCODE -ne 0) { throw "output-gain settings smoke failed: $LASTEXITCODE" }
          & (Join-Path $smokes 'OpenJocPropertyPageSmoke.exe') $lavAudio
          if ($LASTEXITCODE -ne 0) { throw "standalone smoke failed: OpenJocPropertyPageSmoke.exe ($LASTEXITCODE)" }
          & (Join-Path $smokes 'LAVAudioIdentitySmoke.exe') (Join-Path $extract 'runtime\LAVAudio.ax')
          if ($LASTEXITCODE -ne 0) { throw "LAVAudio identity smoke failed: $LASTEXITCODE" }

      - name: Upload LAV asset to the OpenJOC release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
        run: |
          $archive = Join-Path '${{ steps.package.outputs.package_dir }}' '${{ steps.identity.outputs.asset_name }}.zip'
          $available = $false
          # The main Release workflow builds several platform artifacts before it
          # becomes available; allow the full 25-minute publication window.
          for ($attempt = 1; $attempt -le 150; $attempt++) {
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { $available = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $available) { throw "release did not become available: $env:RELEASE_TAG" }
          gh release upload $env:RELEASE_TAG $archive --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed: $LASTEXITCODE" }

      - name: Retain built LAV asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.asset_name }}
          path: ${{ steps.package.outputs.package_dir }}/*.zip
          if-no-files-found: error
