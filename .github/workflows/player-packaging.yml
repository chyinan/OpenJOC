name: OpenJOC player packaging

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to package
        required: false
        default: master
        type: string
      release_candidate:
        description: Use final release archive names and release metadata
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      source_ref:
        required: false
        default: ''
        type: string
      release_candidate:
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/player-packaging.yml"
      - "packaging/player/**"
      - "scripts/build-openjoc-player*"
      - "scripts/player-package.py"
      - "scripts/generate-player-fixtures.sh"
      - "scripts/qualify-player-package.py"
      - "scripts/verify-player-package.sh"
      - "integrations/ffmpeg/native/**"
      - "integrations/mpv/**"
      - "crates/openjoc-capi/**"
      - "crates/openjoc-ffmpeg/**"

permissions:
  contents: read

concurrency:
  group: player-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  SOURCE_DATE_EPOCH: 0

jobs:
  macos-arm64:
    name: packaged OpenJOC-enabled mpv (macOS arm64)
    runs-on: macos-14
    steps:
      - name: Check out OpenJOC
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install pinned build prerequisites
        run: brew install ffmpeg gstreamer meson ninja libass libplacebo

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sw_vers
          uname -m
          rustc -vV

      - name: Build, extract, and verify the package
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          release_args=()
          if [[ "$RELEASE_CANDIDATE" == "true" ]]; then release_args+=(--release); fi
          scripts/build-openjoc-player.sh \
            --platform macos-arm64 \
            --output "$RUNNER_TEMP/openjoc-mpv-macos" \
            --work "$RUNNER_TEMP/openjoc-player-work-macos" \
            "${release_args[@]}"
          find "$RUNNER_TEMP/openjoc-mpv-macos" -maxdepth 1 -type f -print

      - name: Generate synthetic qualification fixtures
        run: scripts/generate-player-fixtures.sh "$RUNNER_TEMP/openjoc-player-fixtures"

      - name: Build and package the macOS ecosystem artifacts
        if: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$PWD=/openjoc --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          brew_prefix=
          brew_prefix=$(brew --prefix)
          pkg_config_path=
          pkg_config_path="$(brew --prefix gstreamer)/lib/pkgconfig:$brew_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_PATH="$pkg_config_path"
          gst_target="$RUNNER_TEMP/openjoc-gst-target"
          cargo build -p gst-plugin-openjoc --release --features gstreamer --locked --target-dir "$gst_target"
          ecosystem="$RUNNER_TEMP/openjoc-ecosystem"
          mkdir -p "$ecosystem"
          patch_sha=$(python3 -c 'import json; print(json.load(open("packaging/player/PLAYER_PACKAGE_MANIFEST.json"))["pinned_stack"]["ffmpeg"]["patch_sha256"])')
          ffmpeg_revision=$(python3 -c 'import json; print(json.load(open("packaging/player/PLAYER_PACKAGE_MANIFEST.json"))["pinned_stack"]["ffmpeg"]["commit"])')
          for kind in sdk gstreamer ffmpeg; do mkdir -p "$RUNNER_TEMP/openjoc-ecosystem-$kind"; done
          python3 scripts/package-ecosystem.py sdk --platform macos-arm64 --target-dir target/release --output "$RUNNER_TEMP/openjoc-ecosystem-sdk"
          python3 scripts/package-ecosystem.py gstreamer --platform macos-arm64 --plugin "$gst_target/release/libgstopenjoc.dylib" --output "$RUNNER_TEMP/openjoc-ecosystem-gstreamer"
          python3 scripts/package-ecosystem.py ffmpeg --platform macos-arm64 --ffmpeg "$RUNNER_TEMP/openjoc-player-work-macos/prefix/ffmpeg/bin/ffmpeg" --ffprobe "$RUNNER_TEMP/openjoc-player-work-macos/prefix/ffmpeg/bin/ffprobe" --openjoc-prefix "$RUNNER_TEMP/openjoc-player-work-macos/prefix/openjoc" --ffmpeg-source "$RUNNER_TEMP/openjoc-player-work-macos/src/ffmpeg" --ffmpeg-revision "$ffmpeg_revision" --openjoc-patch-sha256 "$patch_sha" --output "$RUNNER_TEMP/openjoc-ecosystem-ffmpeg"
          cp "$RUNNER_TEMP"/openjoc-ecosystem-{sdk,gstreamer,ffmpeg}/* "$ecosystem/"
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-sdk-*.tar.gz' -print -quit)" --kind sdk --platform macos-arm64
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-gstreamer-plugin-*.tar.gz' -print -quit)" --kind gstreamer-plugin --platform macos-arm64 --run-gstreamer
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-ffmpeg-*.tar.gz' -print -quit)" --kind ffmpeg --platform macos-arm64

      - name: Upload macOS ecosystem artifacts
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-ecosystem-release-macos-arm64
          path: ${{ runner.temp }}/openjoc-ecosystem
          if-no-files-found: error
          retention-days: 7

      - name: Qualify extracted macOS package
        run: |
          archive="$(find "$RUNNER_TEMP/openjoc-mpv-macos" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          python3 scripts/qualify-player-package.py \
            --archive "$archive" --platform macos-arm64 \
            --fixtures "$RUNNER_TEMP/openjoc-player-fixtures" \
            --report "$RUNNER_TEMP/openjoc-player-qualification/macos-arm64.json"

      - name: Upload macOS qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-player-${{ inputs.release_candidate && 'release' || 'development' }}-macos-arm64
          path: |
            ${{ runner.temp }}/openjoc-mpv-macos
            ${{ runner.temp }}/openjoc-player-qualification
          if-no-files-found: warn
          retention-days: 7

  linux-x86_64:
    name: packaged OpenJOC-enabled mpv (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OpenJOC
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install conservative Linux build/runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential git nasm pkg-config meson ninja-build patchelf \
            ffmpeg \
            libass-dev libplacebo-dev libx11-dev libxfixes-dev \
            libxpresent-dev libxrandr-dev libxv-dev libxinerama-dev \
            libxext-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libdrm-dev libgbm-dev libpipewire-0.3-dev libpulse-dev \
            libjpeg-dev liblcms2-dev libvulkan-dev python3 \
            gstreamer1.0-tools gstreamer1.0-plugins-good \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          uname -m
          ldd --version | head -n 1
          rustc -vV

      - name: Build, extract, and verify the package
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          release_args=()
          if [[ "$RELEASE_CANDIDATE" == "true" ]]; then release_args+=(--release); fi
          scripts/build-openjoc-player.sh \
            --platform linux-x86_64 \
            --output "$RUNNER_TEMP/openjoc-mpv-linux" \
            --work "$RUNNER_TEMP/openjoc-player-work-linux" \
            "${release_args[@]}"
          find "$RUNNER_TEMP/openjoc-mpv-linux" -maxdepth 1 -type f -print

      - name: Generate synthetic qualification fixtures
        run: scripts/generate-player-fixtures.sh "$RUNNER_TEMP/openjoc-player-fixtures"

      - name: Build and package the Linux ecosystem artifacts
        if: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$PWD=/openjoc --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          gst_target="$RUNNER_TEMP/openjoc-gst-target"
          cargo build -p gst-plugin-openjoc --release --features gstreamer --locked --target-dir "$gst_target"
          ecosystem="$RUNNER_TEMP/openjoc-ecosystem"
          mkdir -p "$ecosystem"
          patch_sha=$(python3 -c 'import json; print(json.load(open("packaging/player/PLAYER_PACKAGE_MANIFEST.json"))["pinned_stack"]["ffmpeg"]["patch_sha256"])')
          ffmpeg_revision=$(python3 -c 'import json; print(json.load(open("packaging/player/PLAYER_PACKAGE_MANIFEST.json"))["pinned_stack"]["ffmpeg"]["commit"])')
          python3 scripts/package-ecosystem.py sdk --platform linux-x86_64 --target-dir target/release --output "$RUNNER_TEMP/openjoc-ecosystem-sdk"
          python3 scripts/package-ecosystem.py gstreamer --platform linux-x86_64 --plugin "$gst_target/release/libgstopenjoc.so" --output "$RUNNER_TEMP/openjoc-ecosystem-gstreamer"
          python3 scripts/package-ecosystem.py ffmpeg --platform linux-x86_64 --ffmpeg "$RUNNER_TEMP/openjoc-player-work-linux/prefix/ffmpeg/bin/ffmpeg" --ffprobe "$RUNNER_TEMP/openjoc-player-work-linux/prefix/ffmpeg/bin/ffprobe" --openjoc-prefix "$RUNNER_TEMP/openjoc-player-work-linux/prefix/openjoc" --ffmpeg-source "$RUNNER_TEMP/openjoc-player-work-linux/src/ffmpeg" --ffmpeg-revision "$ffmpeg_revision" --openjoc-patch-sha256 "$patch_sha" --output "$RUNNER_TEMP/openjoc-ecosystem-ffmpeg"
          cp "$RUNNER_TEMP"/openjoc-ecosystem-{sdk,gstreamer,ffmpeg}/* "$ecosystem/"
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-sdk-*.tar.gz' -print -quit)" --kind sdk --platform linux-x86_64
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-gstreamer-plugin-*.tar.gz' -print -quit)" --kind gstreamer-plugin --platform linux-x86_64 --run-gstreamer
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-ffmpeg-*.tar.gz' -print -quit)" --kind ffmpeg --platform linux-x86_64

      - name: Upload Linux ecosystem artifacts
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-ecosystem-release-linux-x86_64
          path: ${{ runner.temp }}/openjoc-ecosystem
          if-no-files-found: error
          retention-days: 7

      - name: Qualify extracted Linux package
        run: |
          archive="$(find "$RUNNER_TEMP/openjoc-mpv-linux" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          python3 scripts/qualify-player-package.py \
            --archive "$archive" --platform linux-x86_64 \
            --fixtures "$RUNNER_TEMP/openjoc-player-fixtures" \
            --report "$RUNNER_TEMP/openjoc-player-qualification/linux-x86_64.json"

      - name: Upload Linux qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-player-${{ inputs.release_candidate && 'release' || 'development' }}-linux-x86_64
          path: |
            ${{ runner.temp }}/openjoc-mpv-linux
            ${{ runner.temp }}/openjoc-player-qualification
          if-no-files-found: warn
          retention-days: 7

  windows-x64:
    name: packaged OpenJOC-enabled mpv (Windows x64 / MSYS2 MinGW-w64)
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out OpenJOC
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install the isolated MinGW-w64 build surface
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            unzip
            python
            make
            diffutils
            pkgconf
            meson
            ninja
            yasm
            nasm
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-libplacebo
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-luajit
            mingw-w64-x86_64-lcms2
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good

      - name: Select the GNU Rust target and build the ZIP
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          pacman -Q > "$(cygpath -u "$RUNNER_TEMP")/msys2-package-manifest.txt"
          rustc -vV
          gcc --version | head -n 1
          output="$(cygpath -u "$RUNNER_TEMP")/openjoc-mpv-windows"
          work="$(cygpath -u "$RUNNER_TEMP")/openjoc-player-work-windows"
          release_args=()
          if [[ "$RELEASE_CANDIDATE" == "true" ]]; then release_args+=(--release); fi
          scripts/build-openjoc-player-windows.sh --output "$output" --work "$work" "${release_args[@]}"
          find "$output" -maxdepth 1 -type f -print

      - name: Generate synthetic qualification fixtures
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          scripts/generate-player-fixtures.sh "$(cygpath -u "$RUNNER_TEMP")/openjoc-player-fixtures"

      - name: Build and package the Windows ecosystem artifacts
        if: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$PWD=/openjoc --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          root="$(cygpath -u "$RUNNER_TEMP")"
          gst_target="$root/openjoc-gst-target"
          cargo build -p gst-plugin-openjoc --release --features gstreamer --locked --target x86_64-pc-windows-gnu --target-dir "$gst_target"
          ecosystem="$root/openjoc-ecosystem"
          mkdir -p "$ecosystem"
          patch_sha=$(python3 -c 'import json; print(json.load(open("packaging/player/PLAYER_PACKAGE_MANIFEST.json"))["pinned_stack"]["ffmpeg"]["patch_sha256"])')
          ffmpeg_revision=$(python3 -c 'import json; print(json.load(open("packaging/player/PLAYER_PACKAGE_MANIFEST.json"))["pinned_stack"]["ffmpeg"]["commit"])')
          python3 scripts/package-ecosystem.py sdk --platform windows-x64 --target-dir "$PWD/target/x86_64-pc-windows-gnu/release" --windows-runtime-dir /mingw64/bin --output "$root/openjoc-ecosystem-sdk"
          python3 scripts/package-ecosystem.py gstreamer --platform windows-x64 --plugin "$gst_target/x86_64-pc-windows-gnu/release/gstopenjoc.dll" --output "$root/openjoc-ecosystem-gstreamer"
          python3 scripts/package-ecosystem.py ffmpeg --platform windows-x64 --ffmpeg "$root/openjoc-player-work-windows/prefix/ffmpeg/bin/ffmpeg.exe" --ffprobe "$root/openjoc-player-work-windows/prefix/ffmpeg/bin/ffprobe.exe" --openjoc-prefix "$root/openjoc-player-work-windows/prefix/openjoc" --windows-runtime-dir /mingw64/bin --ffmpeg-source "$root/openjoc-player-work-windows/src/ffmpeg" --ffmpeg-revision "$ffmpeg_revision" --openjoc-patch-sha256 "$patch_sha" --output "$root/openjoc-ecosystem-ffmpeg"
          cp "$root"/openjoc-ecosystem-{sdk,gstreamer,ffmpeg}/* "$ecosystem/"
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-sdk-*.zip' -print -quit)" --kind sdk --platform windows-x64
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-gstreamer-plugin-*.zip' -print -quit)" --kind gstreamer-plugin --platform windows-x64 --run-gstreamer
          python3 scripts/verify-ecosystem-package.py --archive "$(find "$ecosystem" -name 'openjoc-ffmpeg-*.zip' -print -quit)" --kind ffmpeg --platform windows-x64

      - name: Upload Windows ecosystem artifacts
        if: ${{ inputs.release_candidate }}
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-ecosystem-release-windows-x64
          path: ${{ runner.temp }}/openjoc-ecosystem
          if-no-files-found: error
          retention-days: 7

      - name: Qualify extracted Windows package
        run: |
          temp_root="$(cygpath -u "$RUNNER_TEMP")"
          archive="$(find "$temp_root/openjoc-mpv-windows" -maxdepth 1 -name '*.zip' -type f -print -quit)"
          python3 scripts/qualify-player-package.py \
            --archive "$archive" --platform windows-x64 \
            --fixtures "$temp_root/openjoc-player-fixtures" \
            --report "$temp_root/openjoc-player-qualification/windows-x64.json"

      - name: Upload Windows qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openjoc-player-${{ inputs.release_candidate && 'release' || 'development' }}-windows-x64
          path: |
            ${{ runner.temp }}/openjoc-mpv-windows
            ${{ runner.temp }}/openjoc-player-qualification
            ${{ runner.temp }}/msys2-package-manifest.txt
          if-no-files-found: warn
          retention-days: 7
