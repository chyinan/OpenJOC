site_name: OpenJOC documentation
site_description: Open-source clean-room E-AC-3 JOC decoder and spatial renderer documentation.
site_author: OpenJOC contributors
site_url: https://chyinan.github.io/OpenJOC/
repo_name: chyinan/OpenJOC
repo_url: https://github.com/chyinan/OpenJOC
edit_uri: edit/master/docs/site/
docs_dir: docs/site
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  icon:
    logo: material/surround-sound
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: OpenJOC 文档
          site_description: OpenJOC 开源、清洁室实现的 E-AC-3 JOC 解码器与空间渲染器文档。
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Getting started: 开始使用
            Introduction: 简介
            Installation: 安装
            Quick start: 快速开始
            Supported platforms: 支持的平台
            Using OpenJOC: 使用 OpenJOC
            Decode and inspect: 解码与检查
            Speaker rendering: 扬声器渲染
            Binaural and SOFA: 双耳与 SOFA
            Reconstructed ADM export: 重建 ADM 导出
            Reconstructed ADM semantics: 重建 ADM 语义
            Custom speaker layouts: 自定义扬声器布局
            Windows LAV / PotPlayer: Windows LAV / PotPlayer
            Explicit render-scene workflow: 显式 render-scene 工作流
            Troubleshooting: 故障排除
            Concepts: 概念
            E-AC-3 JOC overview: E-AC-3 JOC 概览
            OpenJOC architecture: OpenJOC 架构
            OAMD: OAMD
            Decoded Objects vs authored Objects: 解码对象与创作对象
            Spatial portability: 空间可移植性
            Reference: 参考
            CLI reference: CLI 参考
            Output formats: 输出格式
            Rust API: Rust API
            C ABI: C ABI
            Compatibility and limitations: 兼容性与限制
            Compatibility: 兼容性
            Known limitations: 已知限制
            Reconstructed ADM renderer equivalence: 重建 ADM 渲染器等价性
            PCM24 headroom: PCM24 余量
            Project: 项目
            Capability matrix: 能力矩阵
            Clean-room methodology: 清洁室方法
            Standards and references: 标准与参考
            Integrations: 集成
            Open Problems & Contribution Opportunities: 开放问题与贡献方向
            Contributing: 参与贡献
            Changelog: 更新日志

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  release: v0.15.0

copyright: OpenJOC contributors · Apache-2.0

nav:
  - Home: index.md
  - Getting started:
      - Introduction: getting-started/introduction.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Supported platforms: getting-started/supported-platforms.md
  - Using OpenJOC:
      - Decode and inspect: using/decode-inspect.md
      - Speaker rendering: using/speaker-rendering.md
      - Binaural and SOFA: using/binaural-sofa.md
      - Reconstructed ADM export: using/reconstructed-adm-export.md
      - Reconstructed ADM semantics: using/reconstructed-adm-semantics.md
      - Custom speaker layouts: using/custom-speaker-layouts.md
      - Windows LAV / PotPlayer: using/windows-lav-potplayer.md
      - Explicit render-scene workflow: using/explicit-scene-workflow.md
      - Troubleshooting: using/troubleshooting.md
  - Concepts:
      - E-AC-3 JOC overview: concepts/eac3-joc-overview.md
      - OpenJOC architecture: concepts/architecture.md
      - OAMD: concepts/oamd.md
      - Decoded Objects vs authored Objects: concepts/decoded-vs-authored-objects.md
      - Spatial portability: concepts/spatial-portability.md
  - Reference:
      - CLI reference: reference/cli-reference.md
      - Output formats: reference/output-formats.md
      - Rust API: reference/rust-api.md
      - C ABI: reference/c-abi.md
  - Compatibility and limitations:
      - Compatibility: compatibility/compatibility.md
      - Known limitations: compatibility/known-limitations.md
      - Reconstructed ADM renderer equivalence: compatibility/renderer-equivalence.md
      - PCM24 headroom: compatibility/pcm24-headroom.md
  - Project:
      - Capability matrix: project/capabilities.md
      - Clean-room methodology: project/clean-room-methodology.md
      - Standards and references: project/standards-references.md
      - Integrations: project/integrations.md
      - Open Problems & Contribution Opportunities: project/open-problems.md
      - Contributing: project/contributing.md
      - Changelog: project/changelog.md
